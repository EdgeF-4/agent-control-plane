[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane"
version = "0.1.0"
description = "Self-hosted governance, observability, audit and cost control for automated agents."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.52.1,<1",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "asyncpg>=0.31,<1",
    "aiosqlite>=0.22.1,<1",
    "pydantic>=2.13.4,<3",
    "bcrypt>=5,<6",
    "alembic>=1.19.1,<2",
]

# The control plane composes five engine packages. They install from the local
# checkouts (or vendored copies during an image build); see scripts/dev-setup.sh
# and scripts/vendor-engines.sh. They are not pulled from a public index.

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28.1,<1",
]

[project.scripts]
control-plane = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
