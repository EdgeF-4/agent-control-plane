# Alembic configuration for the control plane's projection store.
#
# The database URL is supplied at runtime by env.py — from the app settings
# (config.json) when the API applies migrations on startup, or from the
# ACP_CONFIG / config.json file when an operator runs `alembic upgrade head`
# by hand. It is intentionally left blank here so no connection string (and no
# secret) ever lives in a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
